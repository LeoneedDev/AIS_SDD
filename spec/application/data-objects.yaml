data_objects:
  - id: "DO-Order"
    name: "Order"
    meaning: >
      Samotná objednávka (požiadavka) zákazníka. Nesie k nej patriaci model,
      kontaktné údaje zákazníka, informácie o platbe a celú históriu schvaľovania,
      zmien, súhlasov a nesúhlasov zákazníka. Jedna objednávka = jeden model.
    related_business_object: "BO-Order"
    owner_component: "AC-OrderOrchestrator"
    sensitive_data: true

  - id: "DO-PromptOrder"
    name: "Prompt Order"
    specialization_of: "DO-Order"
    meaning: >
      Objednávka, v ktorej zákazník dodá iba popis alebo schémy dielu; jej typ
      určuje cestu VAR-1 (model vytvoríme my).
    related_business_object: "BO-Order"
    owner_component: "AC-CustomerPortal"
    sensitive_data: true

  - id: "DO-ModelOrder"
    name: "Model order"
    specialization_of: "DO-Order"
    contains: ["DO-3DModel"]
    meaning: >
      Objednávka, v ktorej zákazník dodá hotový 3D model; jej typ určuje cestu
      VAR-2 (model iba overíme).
    related_business_object: "BO-Order"
    owner_component: "AC-CustomerPortal"
    sensitive_data: true

  - id: "DO-ModelingTask"
    name: "Modeling task"
    meaning: >
      Úloha pre 3D modelára k jednej objednávke: ktorý model má vytvoriť
      alebo overiť a pre koho.
    related_data_objects: ["DO-Order", "DO-3DModel"]
    owner_component: "AC-OrderOrchestrator"
    sensitive_data: false

  - id: "DO-3DModel"
    name: "3D model"
    meaning: >
      Súbor 3D modelu spolu s informáciami potrebnými pre 3D tlač: metadáta,
      rozmery a ďalšie údaje o modeli.
    related_business_object: "BO-3DModel"
    realized_by_artifact: "ART-PartModelFile"
    owner_component: "AC-ModelRepository"
    note: >
      Počas overovania je model v Model Validator (medzistav); overený model
      sa uloží do Model Repository.
    sensitive_data: false

  - id: "DO-ModelApproval"
    name: "Model approval"
    meaning: >
      Aktuálny stav schválenia modelu a história: koľko úprav prebehlo, aké to
      boli, kto ich urobil, komentáre zákazníka a jeho súhlasy s opravou alebo
      rozdelením modelu (BR-005, BR-009).
    part_of: "DO-Order"
    related_data_objects: ["DO-3DModel"]
    owner_component: "AC-ModelingWorkspace"
    sensitive_data: true

  - id: "DO-Notification"
    name: "Notification"
    meaning: >
      Informácia pre zákazníka o tom, čo sa v jeho objednávke alebo modeli zmenilo;
      doručuje sa do účtu, prípadne e-mailom alebo SMS (QR-001).
    related_data_objects: ["DO-Order"]
    owner_component: "AC-Notifier"
    sensitive_data: true

  - id: "DO-UserAccount"
    name: "User account"
    meaning: >
      Účet zákazníka alebo zamestnanca: login, hash hesla, rola (zákazník, 3D
      modelár, manažér) a pri zamestnancovi prezývka (QR-001). Bez e-mailu a
      telefónu (sú voliteľné a patria k iným údajom).
    owner_component: "AC-CustomerPortal"
    sensitive_data: true
    note: "Nový prvok (QR-002); v modeli EA zatiaľ nie je."
