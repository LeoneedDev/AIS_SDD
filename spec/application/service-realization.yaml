service_realization:
  - business_service: "BS-3DModelingApproval"
    used_by_roles: ["ACT-Clients"]
    realized_by_business_processes: ["BP-ModelThePart"]
    supported_by_application_services:
      - "AS-ModellingOfComponent"
      - "AS-ApprovingModel"
    provided_by_components:
      - "AC-ModelingWorkspace"
      - "AC-ModelValidator"
    part_of_application_service: "AS-3DPrinting"

    alternative_paths:
      junction: "JN-WhoProvidesModel"
      junction_kind_in_model: "OR"
      paths:
        - id: "VAR-1"
          name: "Model vytvoríme my"
          application_service: "AS-ModellingOfComponent"
          component: "AC-ModelingWorkspace"
          data_objects: ["DO-PromptOrder"]
          condition: >
            Zákazník nás požiada o vytvorenie modelu a pošle špecifikáciu, schému
            alebo aspoň textový popis toho, čo chce.

        - id: "VAR-2"
          name: "Model dodá zákazník"
          application_service: "AS-ApprovingModel"
          component: "AC-ModelValidator"
          data_objects: ["DO-ModelOrder", "DO-3DModel"]
          condition: >
            Zákazník pošle hotový 3D model a chce ho iba vytlačiť.

    requirements: ["R-001"]

    note: >
      Služba ponúka dva spôsoby realizácie. Zákazník niekedy vie, čo chce, ale
      nemá hotový model alebo ho nechce zostaviť sám model vytvoríme my.
      Inokedy už má hotový 3D model (napr. vlastný alebo open-source) a chce
      ho iba vytlačiť, prípadne po tlači zostaviť.
