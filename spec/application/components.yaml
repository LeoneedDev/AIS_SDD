# =====================================================================
# spec/application/components.yaml
# Funkcionalita: 3D model pre zákazku – vytvorenie alebo schválenie modelu
#
# ПОДСКАЗКИ: "# ✍️" — подсказки, после заполнения удали.
#
# Mapovanie ID → prvok v modeli Sparx EA (hlavné prvky, balík "Application Colaborations")
#   AC-ModelingWorkspace    = Application Component "Modeling Workspace"   EA #895   (cesta 1)
#   AC-ModelValidator       = Application Component "Model Validator"      EA #894   (cesta 2)
#   AC-ModelRepository      = Application Component "Model Repository"     EA #893
#   AC-CustomerPortal       = Application Component "Customer portal"      EA #889
#   AC-OrderOrchestrator    = Application Component "Order Orchestrator"   EA #891
#   AC-Notifier             = Application Component "Notifier"             EA #892
#   AC-Slicer               = Application Component "Slicer"               EA #897
#   ACO-ModelPipeline       = Application Collaboration "Model Pipeline"   EA #1013
#   AS-ModellingOfComponent = Application Service "Modelling of component" EA #903
#   AS-ApprovingModel       = Application Service "Aproving model"         EA #904
#   AS-3DPrinting           = Application Service "3D printing"            EA #832
#   AS-InformingCustomer    = Application Service "Informing and contacting customer" EA #907
#   AS-OnlineOrdering       = Application Service "Online ordering & quoting" EA #831
#   DO-3DModel, DO-ModelOrder, DO-PromptOrder = pozri data-objects.yaml
#
# Dve hlavné karty (cesta 1 a 2), ostatné sú partneri – stačí 1 veta zodpovednosti.
# =====================================================================

application_components:
  # ================= CESTA 1: model vytvoríme my =================
  - id: "AC-ModelingWorkspace"
    name: "Modeling Workspace"
    # z modelu: ACO-ModelPipeline —Aggregation→ AC-ModelingWorkspace
    part_of_collaboration: "ACO-ModelPipeline"

    # ✍️ ЗА ЧТО отвечает. Одна ответственность, без классов и фреймворков.
    responsibility: >


    # z modelu: AC-ModelingWorkspace —Realization→ AS-ModellingOfComponent
    provides_services: ["AS-ModellingOfComponent"]

    # ✍️ Чьи сервисы использует — заполни после interactions.yaml (где он consumer).
    uses_services: []

    # z modelu: AC-ModelingWorkspace —Access read→ DO-PromptOrder (len čítanie)
    # ✍️ РЕШЕНИЕ: владеет ли он каким-то Data Object (то есть только он его меняет)?
    # ✍️ В модели write-доступа у него нет ни к одному Data Object.
    owns_data_objects: []

    # z modelu: Flow  AC-ModelingWorkspace → AC-ModelValidator, AC-ModelRepository, AC-CustomerPortal
    #           Flow  AC-OrderOrchestrator, AC-ModelRepository, AC-ModelValidator → AC-ModelingWorkspace
    # ✍️ РЕШЕНИЕ: каким компонентам он МОЖЕТ передавать данные или кого вызывать.
    # ✍️ Оставь только нужные для этой функции.
    allowed_dependencies: []

    requirements: ["R-001"]

  # ================= CESTA 2: model dodá zákazník =================
  - id: "AC-ModelValidator"
    name: "Model Validator"
    part_of_collaboration: "ACO-ModelPipeline"

    # ✍️ ЗА ЧТО отвечает. 1 предложение.
    responsibility: >


    # z modelu: AC-ModelValidator —Realization→ AS-ApprovingModel
    provides_services: ["AS-ApprovingModel"]

    uses_services: []

    # z modelu: AC-ModelValidator —Access read/write→ DO-3DModel
    #           AC-ModelValidator —Access read→ DO-ModelOrder
    # ✍️ РЕШЕНИЕ: он единственный, кто ПИШЕТ DO-3DModel. Значит, он владелец?
    # ✍️ Если да — впиши "DO-3DModel". Если владелец другой — объясни в data-objects.yaml.
    owns_data_objects: []

    # z modelu: Flow  AC-ModelValidator → AC-Slicer, AC-Notifier, AC-OrderOrchestrator, AC-ModelingWorkspace
    #           Flow  AC-ModelingWorkspace → AC-ModelValidator
    # ✍️ РЕШЕНИЕ: оставь только нужные.
    allowed_dependencies: []

    requirements: ["R-001"]

  # ================= partneri (1 veta) =================
  - id: "AC-ModelRepository"
    name: "Model Repository"
    # ✍️ 1 предложение. (В модели не реализует ни одного Application Service.)
    responsibility: ""
    provides_services: []

  - id: "AC-CustomerPortal"
    name: "Customer portal"
    # ✍️ 1 предложение.
    responsibility: ""
    # z modelu: Realization → AS-InformingCustomer, AS-OnlineOrdering
    provides_services: ["AS-InformingCustomer", "AS-OnlineOrdering"]

  - id: "AC-OrderOrchestrator"
    name: "Order Orchestrator"
    # ✍️ 1 предложение.
    responsibility: ""
    # z modelu: Realization → AS-OnlineOrdering
    provides_services: ["AS-OnlineOrdering"]

  - id: "AC-Notifier"
    name: "Notifier"
    # ✍️ 1 предложение.
    responsibility: ""
    # z modelu: Realization → AS-InformingCustomer
    provides_services: ["AS-InformingCustomer"]

  - id: "AC-Slicer"
    name: "Slicer"
    part_of_collaboration: "ACO-ModelPipeline"
    # ✍️ 1 предложение.
    responsibility: ""
    # z modelu: Realization → AS-3DPrinting
    provides_services: ["AS-3DPrinting"]
