interactions:
  - id: "INT-001"
    path: "VAR-1"
    flow_in_model: "AC-OrderOrchestrator → AC-ModelingWorkspace"
    description: "Orchestrator pridelí objednávku modelárovi ako úlohu na modelovanie."
    consumer: "AC-OrderOrchestrator"
    provider: "AC-ModelingWorkspace"
    uses_application_service: "AS-ModellingOfComponent"
    information: ["DO-ModelingTask", "DO-PromptOrder"]
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-002"
    path: "VAR-1"
    flow_in_model: "AC-ModelingWorkspace → AC-ModelRepository"
    description: "Uloženie vytvoreného modelu a jeho revízií."
    consumer: "AC-ModelingWorkspace"
    provider: "AC-ModelRepository"
    uses_application_service: "AS-ModelStorage"
    information: ["DO-3DModel"]
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-003"
    path: "VAR-1"
    flow_in_model: "AC-ModelRepository → AC-ModelingWorkspace"
    description: >
      Opätovné použitie: pre nového zákazníka sa vezme už vytvorený a overený model
      z repozitára (3D model library), iba ak to pôvodný zákazník povolil (BR-006).
      Nový zákazník ho aj tak schvaľuje (PRIN-001).
    consumer: "AC-ModelingWorkspace"
    provider: "AC-ModelRepository"
    uses_application_service: "AS-ModelStorage"
    information: ["DO-3DModel"]
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-004"
    path: "VAR-1"
    flow_in_model: "AC-ModelingWorkspace → AC-CustomerPortal"
    description: "Model sa zobrazí zákazníkovi na schválenie."
    consumer: "AC-ModelingWorkspace"
    provider: "AC-CustomerPortal"
    uses_application_service: "AS-InformingCustomer"
    information: ["DO-3DModel"]
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-005"
    path: "VAR-1 / VAR-2"
    flow_in_model: "AC-ModelingWorkspace → AC-ModelValidator"
    description: >
      Aj náš model po schválení zákazníkom overí ďalší modelár cez Model Validator
      (kvalita a tlačiteľnosť).
    consumer: "AC-ModelingWorkspace"
    provider: "AC-ModelValidator"
    uses_application_service: "AS-ApprovingModel"
    information: ["DO-3DModel"]
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-006"
    path: "VAR-1 / VAR-2"
    flow_in_model: "AC-ModelValidator → AC-ModelingWorkspace"
    description: >
      Ak overenie neprešlo a s modelom nie je niečo v poriadku, model sa vráti
      modelárovi na prepracovanie (BR-005).
    consumer: "AC-ModelValidator"
    provider: "AC-ModelingWorkspace"
    uses_application_service: "AS-ModellingOfComponent"
    information: ["DO-3DModel"]
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-007"
    path: "VAR-2"
    flow_in_model: "AC-ModelValidator → AC-Notifier"
    description: "Zákazník dostane informáciu o tom, čo sa zmenilo (výsledok overenia, chyby v modeli)."
    consumer: "AC-ModelValidator"
    provider: "AC-Notifier"
    uses_application_service: "AS-InformingCustomer"
    information: ["DO-Notification"]
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-008"
    path: "VAR-2"
    flow_in_model: "AC-ModelValidator → AC-OrderOrchestrator"
    description: "Odovzdá aktuálny stav overenia modelu (OK, chyba a pod.)."
    consumer: "AC-ModelValidator"
    provider: "AC-OrderOrchestrator"
    uses_application_service: "AS-RequestProcessing"
    information: ["DO-ModelingTask"]
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-009"
    path: "VAR-2"
    flow_in_model: "AC-ModelValidator → AC-Slicer"
    description: >
      Výnimka: model je príliš veľký pre jednu tlačiareň, rozdelí sa na viac
      tlačiarní a diely sa potom spoja (súvisí s C-001). Rozdelenie iba so
      súhlasom zákazníka (BR-009).
    consumer: "AC-ModelValidator"
    provider: "AC-Slicer"
    uses_application_service: "AS-ApprovingPrintSettings"
    information: ["DO-3DModel"]
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-010"
    path: "VAR-1 / VAR-2"
    flow_in_model: "AC-CustomerPortal → Modeler chat → ACO-ModelPipeline"
    description: >
      Univerzálny chat: zákazník môže položiť akúkoľvek otázku (ako podpora). Ak uvedie
      konkrétnu objednávku, chat sa naviaže na ňu a spojí ho s modelárom, manažérom
      alebo systémovou podporou. Popis a schémy sa posielajú v samotnej objednávke.
    consumer: "ACO-ModelPipeline"
    provider: "AC-CustomerPortal"
    uses_application_service: "AS-InformingCustomer"
    information: ["DO-Order"]
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null
