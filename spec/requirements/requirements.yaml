requirements:
  - id: "R-001"
    title: "3D model approval (2 free revisions)"
    statement: >
      Systém musí umožniť zákazníkovi pred tlačou skontrolovať 3D model – vytvorený
      nami podľa jeho popisu (VAR-1) alebo dodaný ním a overený nami (VAR-2) – a
      schváliť ho alebo požiadať o úpravu. Do tlače smie ísť iba schválený model.
      Zákazník má k dispozícii 2 bezplatné revízie modelu.
    rationale: >
      Diel sa vyrába ako jediný kus podľa požiadavky zákazníka (G-001); preto sa nič
      netlačí bez jeho súhlasu (PRIN-001). Limit 2 bezplatných revízií vychádza
      zo všeobecných obchodných podmienok (Contract EA #823).
    source_goals: ["G-001"]
    owner: "SH-Manager"
    priority: "must"
    status: "draft"
    realized_by: ["BS-3DModelingApproval", "AS-ModellingOfComponent", "AS-ApprovingModel"]
    acceptance_scenarios: ["SC-001-01", "SC-001-02", "SC-001-03", "SC-001-04", "SC-001-05", "SC-001-06", "SC-001-07", "SC-001-08"]

constraints:
  - id: "C-001"
    statement: >
      Tlačíme iba modely, ktoré sa dajú vytlačiť v rámci parametrov našich
      tlačiarní (rozmer, materiál).
    owner: "SH-ManagementCEO"
    status: "draft"
