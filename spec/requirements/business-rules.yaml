business_rules:
  - id: "BR-001"
    title: "Tlačí sa iba model so súhlasom zákazníka"
    type: "invariant"
    statement: >
      Do tlače smie ísť iba model so súhlasom zákazníka: pri VAR-1 model so stavom
      schválenia "approved", pri VAR-2 nezmenený model dodaný zákazníkom (BR-008).
    owner: "SH-Manager"
    requirements: ["R-001"]
    scenarios: ["SC-001-01", "SC-001-05", "SC-001-08"]

  - id: "BR-002"
    title: "Dve bezplatné revízie, potom nový vývoj"
    type: "rule"
    statement: >
      Revízia je úprava modelu, ktorú urobia naši 3D modelári potom, čo zákazník
      s naším modelom nesúhlasil a uviedol komentár (aj oprava chýb v modeli
      zákazníka pri VAR-2). Zákazník si sám ľubovoľnú úpravu objednať nemôže;
      nové požiadavky pošle ako novú objednávku s popisom, schémou alebo modelom.
      Zákazník má k dispozícii 2 bezplatné revízie na oboch cestách. Ďalší
      nesúhlas sa už nerieši ako revízia, ale ako vývoj nového modelu (nová
      platba a nový záznam schválenia).
    owner: "SH-Manager"
    requirements: ["R-001"]
    scenarios: ["SC-001-02", "SC-001-05"]

  - id: "BR-003"
    title: "O schválení modelu rozhoduje iba zákazník"
    type: "rule"
    statement: >
      Zákazník v portáli sám potvrdí, že s modelom (a s našimi zmenami) súhlasí,
      alebo nesúhlasí a uvedie komentár, s čím nesúhlasí. 3D modelár ani manažér
      za zákazníka rozhodnúť nemôžu.
    owner: "SH-Manager"
    requirements: ["R-001"]
    scenarios: ["SC-001-01"]

  - id: "BR-004"
    title: "Vlastné zmeny zákazníka pred tlačou"
    type: "rule"
    statement: >
      Zákazník môže pred tlačou sám nahrať nový model alebo zmeniť objednávku;
      takáto zmena nie je revízia a je bezplatná, model sa iba znova overí.
      Limit sa uplatní automaticky: po 10 nových nahraniach v sledovanom období
      sa ďalší model bez doplatku za opätovné overenie neoverí. Dĺžka obdobia
      (napr. 1 deň alebo 10 dní) je zatiaľ UNKNOWN. Po začatí tlače zmena nie je možná.
    owner: "SH-Manager"
    requirements: ["R-001"]
    scenarios: ["SC-001-11"]

  - id: "BR-005"
    title: "Oprava modelu iba so súhlasom zákazníka"
    type: "rule"
    statement: >
      Ak s modelom nie je niečo v poriadku, opravíme ho, ale najprv sa zákazníka
      opýtame, či chce, aby sme ho opravili. Súhlas alebo nesúhlas zadáva zákazník
      sám; bez jeho súhlasu model neupravujeme. Opravený model zákazník potom
      schvaľuje (BR-003).
    owner: "SH-ManagementCEO"
    requirements: ["R-001"]
    scenarios: ["SC-001-04", "SC-001-08"]

  - id: "BR-006"
    title: "Opätovné použitie modelu iba so súhlasom vlastníka"
    type: "rule"
    statement: >
      Model sa ponúkne inému zákazníkovi iba vtedy, ak pôvodný zákazník povolil jeho
      zdieľanie. Bežný zákazník si zdieľanie volí sám. Pri firemných (B2B) zákazníkoch
      je zdieľanie predvolene vypnuté; ak ho povolia, môžu dostať zľavu.
    owner: "SH-Manager"
    requirements: ["R-001"]
    scenarios: ["SC-001-06", "SC-001-07"]

  - id: "BR-007"
    title: "Model upravujú iba naši 3D modelári"
    type: "rule"
    statement: >
      Zákazník model v našom systéme sám neupravuje; môže iba požiadať o úpravu.
      Úpravy robia výhradne naši 3D modelári. Ak chce zákazník model meniť sám,
      urobí to vo vlastnom nástroji a pošle nový model (VAR-2).
    owner: "SH-Manager"
    requirements: ["R-001"]
    scenarios: ["SC-001-05"]

  - id: "BR-008"
    title: "Nezmenený model zákazníka sa považuje za schválený"
    type: "rule"
    statement: >
      Ak zákazník dodá vlastný model (VAR-2) a ten prejde kontrolou bez chýb,
      považuje sa za schválený zákazníkom a ide priamo do tlače. Ak model na
      žiadosť zákazníka upravíme (BR-005), upravený model musí zákazník schváliť
      rovnako ako pri VAR-1.
    owner: "SH-Manager"
    requirements: ["R-001"]
    scenarios: ["SC-001-03"]

  - id: "BR-009"
    title: "Rozdelenie modelu na časti iba so súhlasom zákazníka"
    type: "rule"
    statement: >
      Ak je model príliš veľký na tlač v celku (C-001), pred rozdelením na časti
      sa zákazníka opýtame, či s rozdelením súhlasí; rozhodnutie zadáva zákazník
      sám. Bez jeho súhlasu sa model
      nerozdelí ani nevytlačí; v celku ho vytlačiť nevieme, preto zákazníkovi
      oznámime, že takúto objednávku nevieme vykonať.
    owner: "SH-Manager"
    requirements: ["R-001"]
    scenarios: ["SC-001-09", "SC-001-10"]
