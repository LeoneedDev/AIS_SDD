    owner: "SH-Manager"
    version: "—"
    maturity: "AS-IS – v prevádzke"
    evidence: "Application Component 'Model Repository' (EA #893), Resource '3D model library' (EA #108)"
    decision: "použiť"
    relevant_to_R001: true

