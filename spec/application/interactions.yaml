# =====================================================================
# spec/application/interactions.yaml
# Funkcionalita: 3D model pre zákazku – vytvorenie alebo schválenie modelu
# Zdroj: Flow z/do Modeling Workspace a Model Validator ("Application Cooperation
# Viewpoint" D50). Flow v modeli NEMAJÚ názov – čo sa prenáša, dopĺňaš ty.
# "# ✍️" = otvorená otázka; po vyriešení komentár zmaž.
#
#   consumer — kto služby používa; provider — kto ju poskytuje
#   information — kandidáti: DO-3DModel, DO-ModelOrder, DO-PromptOrder, DO-Order,
#       DO-ModelingTask (#969), DO-Notification (#968), DO-GCode (#967), DO-Exception (#1024)
#   communication_style — "undecided", kým nerozhodneš API vs event
# =====================================================================

interactions:
  # ================= CESTA 1: model vytvoríme my =================
  - id: "INT-001"
    path: "VAR-1"
    flow_in_model: "AC-OrderOrchestrator → AC-ModelingWorkspace"
    # ✍️ Старт пути 1? Модель подсказывает: "Model Intake" (#1014, часть Model Pipeline)
    # ✍️ —Serving→ Order Orchestrator, читает DO-ModelingTask и DO-3DModel.
    # ✍️ Значит consumer = AC-OrderOrchestrator, provider = ACO-ModelPipeline? Подтверди.
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-002"
    path: "VAR-1"
    flow_in_model: "AC-ModelingWorkspace → AC-ModelRepository"
    # ✍️ Сохранение модели? Model Repository не реализует ни одного сервиса — какой сервис тут?
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-003"
    path: "VAR-1"
    flow_in_model: "AC-ModelRepository → AC-ModelingWorkspace"
    # ✍️ Загрузка модели / прошлой ревизии?
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-004"
    path: "VAR-1"
    flow_in_model: "AC-ModelingWorkspace → AC-CustomerPortal"
    # ✍️ Модель показывается клиенту на одобрение? Какой сервис портала:
    # ✍️ AS-InformingCustomer или AS-OnlineOrdering?
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  # ================= SPOJENIE CIEST =================
  - id: "INT-005"
    path: "VAR-1 / VAR-2"
    flow_in_model: "AC-ModelingWorkspace → AC-ModelValidator"
    # ✍️ Наша модель тоже проходит проверку Model Validator? Если да: consumer =
    # ✍️ AC-ModelingWorkspace, provider = AC-ModelValidator, сервис = AS-ApprovingModel.
    # ✍️ Связано с несоответствием TO-BE (#1051) в components.yaml.
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-006"
    path: "VAR-1 / VAR-2"
    flow_in_model: "AC-ModelValidator → AC-ModelingWorkspace"
    # ✍️ Возврат на доработку? Или переход VAR-2 → VAR-1, если модель клиента плохая?
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  # ================= CESTA 2: model dodá zákazník =================
  - id: "INT-007"
    path: "VAR-2"
    flow_in_model: "AC-ModelValidator → AC-Notifier"
    # ✍️ Подтверди: Model Validator через Notifier сообщает клиенту результат проверки?
    # ✍️ (В модели "Notification API" #1016 —Serving→ Model Pipeline, пишет DO-Notification.)
    consumer: "AC-ModelValidator"
    provider: "AC-Notifier"
    uses_application_service: "AS-InformingCustomer"
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-008"
    path: "VAR-2"
    flow_in_model: "AC-ModelValidator → AC-OrderOrchestrator"
    # ✍️ Сообщает, что модель одобрена и заказ идёт дальше? Или ошибку?
    # ✍️ (В модели "Event handler" #972 Order Orchestrator —Serving→ Model Pipeline,
    # ✍️ читает DO-Exception, который пишет Model Pipeline.)
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-009"
    path: "VAR-2"
    flow_in_model: "AC-ModelValidator → AC-Slicer"
    # ✍️ Это одобрение или уже печать? Если печать — удали.
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  # ================= KANÁL ZÁKAZNÍKA =================
  - id: "INT-010"
    path: "VAR-1 / VAR-2"
    flow_in_model: "Customer portal → Modeler chat (#1031) → Model Pipeline"
    # ✍️ Через это клиент даёт описание (VAR-1), загружает модель (VAR-2) и/или одобряет?
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null
