# =====================================================================
# spec/application/service-realization.yaml
# Funkcionalita: 3D model pre zákazku – vytvorenie alebo schválenie modelu
# Textová verzia diagramu "Service Realization Viewpoint" (EA diagram D64).
# "# ✍️" = otvorená otázka; po vyriešení komentár zmaž.
# =====================================================================

service_realization:
  - business_service: "BS-3DModelingApproval"
    used_by_roles: ["ACT-Clients"]
    realized_by_business_processes: ["BP-ModelThePart"]
    supported_by_application_services:
      - "AS-ModellingOfComponent"
      - "AS-ApprovingModel"
    provided_by_components:
      - "AC-ModelingWorkspace"
      - "AC-ModelValidator"
    part_of_application_service: "AS-3DPrinting"

    alternative_paths:
      junction: "JN-WhoProvidesModel"
      # ✍️ V EA je junctionKind = AND, pre "buď–alebo" má byť OR. Po oprave zmeň.
      junction_kind_in_model: "AND"
      paths:
        - id: "VAR-1"
          name: "Model vytvoríme my"
          application_service: "AS-ModellingOfComponent"
          component: "AC-ModelingWorkspace"
          data_objects: ["DO-PromptOrder"]
          # ✍️ Когда выбирается (то же, что в actors-processes.yaml → variants).
          condition: ""

        - id: "VAR-2"
          name: "Model dodá zákazník"
          application_service: "AS-ApprovingModel"
          component: "AC-ModelValidator"
          data_objects: ["DO-ModelOrder", "DO-3DModel"]
          # ✍️ Когда выбирается.
          condition: ""

    requirements: ["R-001"]

    # ✍️ Voliteľné: 1–2 vety, ako aplikácia pomáha business službe.
    note: ""
