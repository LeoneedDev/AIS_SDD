application_components:
  - id: "AC-ModelingWorkspace"
    name: "Modeling Workspace"
    part_of_collaboration: "ACO-ModelPipeline"
    responsibility: >
      Poskytuje 3D modelárom spoločný pracovný priestor na vytváranie a úpravu
      modelov. Každý model je samostatný repozitár (ako Git) s pull requestmi
      a issues a zároveň úloha (ticket), ktorej stav sa dá sledovať.
    provides_services: ["AS-ModellingOfComponent"]
    uses_services: ["AS-ModelStorage", "AS-InformingCustomer", "AS-ApprovingModel"]
    owns_data_objects: ["DO-ModelApproval"]
    allowed_dependencies: ["AC-ModelValidator", "AC-ModelRepository", "AC-CustomerPortal", "AC-OrderOrchestrator", "AC-Notifier", "AC-Slicer"]
    requirements: ["R-001"]

  - id: "AC-ModelValidator"
    name: "Model Validator"
    part_of_collaboration: "ACO-ModelPipeline"
    responsibility: >
      Overuje, že model nemá chyby a dá sa vytlačiť – napr. že rozmery
      zodpovedajú zadaniu (model 30×30 mm, hoci zákazník chce 30×30 cm). Pre každý
      typ tlače (plast, kov, živica, …) a tlačiareň používa vlastný validátor.
      Model je tu iba počas overovania; overený model sa uloží do Model Repository.
    provides_services: ["AS-ApprovingModel"]
    uses_services: []
    owns_data_objects: []
    allowed_dependencies: ["AC-ModelingWorkspace"]
    requirements: ["R-001"]

  - id: "AC-ModelRepository"
    name: "Model Repository"
    responsibility: >
      Úložisko všetkých modelov, ktoré sme spracovali alebo ešte spracujeme
      (nad PostgreSQL); pamätá si, ku ktorej objednávke model patril, a či ho
      zákazník povolil zdieľať (BR-006).
    provides_services: ["AS-ModelStorage"]
    owns_data_objects: ["DO-3DModel"]

  - id: "AC-CustomerPortal"
    name: "Customer portal"
    responsibility: >
      Poskytuje zákazníkom používateľské rozhranie na prácu s naším systémom.
    provides_services: ["AS-InformingCustomer", "AS-CreatingRequest"]
    owns_data_objects: ["DO-PromptOrder", "DO-ModelOrder"]

  - id: "AC-OrderOrchestrator"
    name: "Order Orchestrator"
    responsibility: >
      Rozdeľuje objednávky medzi pracovníkov a manažérov, najmä 3D modelárov.
    provides_services: ["AS-RequestProcessing"]
    owns_data_objects: ["DO-Order", "DO-ModelingTask"]

  - id: "AC-Notifier"
    name: "Notifier"
    responsibility: >
      Doručuje zákazníkovi informácie o stave objednávky.
    provides_services: ["AS-InformingCustomer"]
    owns_data_objects: ["DO-Notification"]

  - id: "AC-Slicer"
    name: "Slicer"
    part_of_collaboration: "ACO-ModelPipeline"
    responsibility: >
      Interná služba slicingu – rozdelí model na časti a pripraví nastavenia tlače.
    provides_services: ["AS-ApprovingPrintSettings"]
