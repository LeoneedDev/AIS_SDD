# =====================================================================
# spec/application/interactions.yaml
# Funkcionalita: 3D model pre zákazku – vytvorenie alebo schválenie modelu
#
# ПОДСКАЗКИ: "# ✍️" — подсказки, после заполнения удали.
#
# Odkiaľ to je: všetky Flow v modeli z/do Modeling Workspace a Model Validator
# (diagram "Application Cooperation Viewpoint"). Flow v modeli NEMAJÚ názov,
# takže čo sa prenáša, model neurčuje — dopĺňaš ty.
#
# Как заполнять:
#   consumer  — кто ИСПОЛЬЗУЕТ сервис (вызывает / отправляет запрос)
#   provider  — кто ПРЕДОСТАВЛЯЕТ сервис
#   uses_application_service — сервис провайдера (provides_services в components.yaml)
#   information — Data Objects. Кандидаты: DO-3DModel, DO-ModelOrder, DO-PromptOrder,
#       DO-Order, DO-ModelingTask (EA #969), DO-Notification (EA #968), DO-GCode (EA #967)
#   communication_style — "undecided", пока не решишь API vs event
#
# ✍️ Взаимодействие, которое не нужно для этой функции, удали целиком.
# =====================================================================

interactions:
  # ================= CESTA 1: model vytvoríme my =================
  - id: "INT-001"
    path: "VAR-1"
    flow_in_model: "AC-OrderOrchestrator → AC-ModelingWorkspace"
    # z modelu aj: AC-OrderOrchestrator —Access write→ DO-ModelingTask
    # ✍️ Это старт пути 1 (заказ передаётся в моделирование)? Кто consumer/provider?
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-002"
    path: "VAR-1"
    flow_in_model: "AC-ModelingWorkspace → AC-ModelRepository"
    # ✍️ Сохранение модели? Model Repository не реализует ни одного сервиса в модели.
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-003"
    path: "VAR-1"
    flow_in_model: "AC-ModelRepository → AC-ModelingWorkspace"
    # ✍️ Загрузка модели / прошлой ревизии?
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-004"
    path: "VAR-1"
    flow_in_model: "AC-ModelingWorkspace → AC-CustomerPortal"
    # ✍️ Модель показывается клиенту на одобрение? Customer portal реализует
    # ✍️ AS-InformingCustomer и AS-OnlineOrdering — какой из них используется?
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  # ================= SPOJENIE CIEST =================
  - id: "INT-005"
    path: "VAR-1 / VAR-2"
    flow_in_model: "AC-ModelingWorkspace → AC-ModelValidator"
    # ✍️ Модель, сделанная нами, тоже проходит проверку Model Validator?
    # ✍️ Если да — consumer = AC-ModelingWorkspace, provider = AC-ModelValidator,
    # ✍️ uses_application_service = AS-ApprovingModel.
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-006"
    path: "VAR-1 / VAR-2"
    flow_in_model: "AC-ModelValidator → AC-ModelingWorkspace"
    # ✍️ Возврат на доработку? Или переход из VAR-2 в VAR-1, если модель клиента плохая?
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  # ================= CESTA 2: model dodá zákazník =================
  - id: "INT-007"
    path: "VAR-2"
    flow_in_model: "AC-ModelValidator → AC-Notifier"
    # z modelu: AC-Notifier —Realization→ AS-InformingCustomer
    # ✍️ Проверь: Model Validator через Notifier сообщает клиенту результат проверки?
    consumer: "AC-ModelValidator"
    provider: "AC-Notifier"
    uses_application_service: "AS-InformingCustomer"
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-008"
    path: "VAR-2"
    flow_in_model: "AC-ModelValidator → AC-OrderOrchestrator"
    # z modelu: AC-OrderOrchestrator —Realization→ AS-OnlineOrdering
    # ✍️ Сообщает, что модель одобрена и заказ может идти дальше?
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  - id: "INT-009"
    path: "VAR-2"
    flow_in_model: "AC-ModelValidator → AC-Slicer"
    # ✍️ Относится к одобрению или это уже следующий шаг (печать)? Если печать — удали.
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null

  # ================= KANÁL ZÁKAZNÍKA =================
  - id: "INT-010"
    path: "VAR-1 / VAR-2"
    # z modelu: AC-CustomerPortal —Composition→ "Modeler chat" (Application Interface, EA #1031)
    #           "Modeler chat" —Serving→ ACO-ModelPipeline
    flow_in_model: "Customer portal → Modeler chat → Model Pipeline"
    # ✍️ РЕШЕНИЕ: через это клиент даёт описание (VAR-1), загружает свою модель (VAR-2)
    # ✍️ и/или одобряет модель? Опиши, что из этого.
    consumer: null
    provider: null
    uses_application_service: null
    information: []
    communication_style: "undecided"
    requirements: ["R-001"]
    decision: null
