    owner: "SH-Manager"
    version: "UNKNOWN"
    maturity: "AS-IS – v prevádzke"
    evidence: "Application Component 'Model Validator' (EA #894), Constraint C-001"
    decision: "upraviť"
    relevant_to_R001: true

