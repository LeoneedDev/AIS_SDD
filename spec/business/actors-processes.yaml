# =====================================================================
# spec/business/actors-processes.yaml
# Funkcionalita: 3D model pre zákazku – vytvorenie alebo schválenie modelu
# "# ✍️" = otvorená otázka; po vyriešení komentár zmaž.
#
# Mapovanie ID → prvok v modeli Sparx EA
#   ACT-Clients               = Business Actor "Clients"                        EA #127
#   ACT-3DModeler             = Business Actor "3D modeler"                     EA #45
#   BP-HandleCustomPartOrder  = Business Process "Handle custom part order"     EA #873
#   BP-AssessRequestAndQuote  = Business Process "Assess request and quote"     EA #874
#   BP-ModelThePart           = Business Process "Model the part"               EA #875
#   BP-PrintAndCheckQuality   = Business Process "Print and check quality"      EA #876
#   BS-3DModelingApproval     = Business Service "3D modeling & model approval" EA #828
#   BO-3DModel                = Business Object "3D model"                      EA #882
#   BO-Order                  = Business Object "Order"                         EA #881
#   JN-WhoProvidesModel       = Junction "Who provides model?"                  EA #1093
#
# Poznámka: v modeli sú to Business Actors, preto prefix ACT-.
# Pole "variants" je doplnok k šablóne – zachytáva dve cesty z Junction v modeli.
# =====================================================================

actors_roles:
  - id: "ACT-Clients"
    name: "Clients"
    type: "Business Actor"
    # ✍️ Что делает клиент: VAR-1 — даёт описание и одобряет, VAR-2 — приносит свою модель.
    responsibility: ""

  - id: "ACT-3DModeler"
    name: "3D modeler"
    type: "Business Actor"
    # ✍️ Что делает моделлер в VAR-1 и в VAR-2.
    responsibility: ""

business_objects:
  - id: "BO-3DModel"
    name: "3D model"
    # ✍️ Смысл для бизнеса (не файл).
    meaning: ""

  - id: "BO-Order"
    name: "Order"
    # ✍️ Смысл для бизнеса. В модели: Meaning "Customer commitment to buy one custom part" (#1019).
    meaning: ""

processes:
  - id: "BP-ModelThePart"
    name: "Model the part"
    part_of: "BP-HandleCustomPartOrder"
    owner: "ACT-3DModeler"

    # ✍️ С чего начинается. В модели: Flow «paid order» из BP-AssessRequestAndQuote.
    trigger: ""

    # ✍️ Что должно быть правдой до начала (заказ оплачен, …).
    preconditions:
      - ""

    # ✍️ Общие шаги: определить, кто даёт модель (Junction) … передать одобренную модель дальше.
    main_flow:
      - ""
      - ""

    # Notes z Junction (EA #1093): "If model is user provided we dont need create it or
    # recreate it, only approve that this model is ok, and user also can ask us to create
    # model for him based on description or schemas"
    variants:
      - id: "VAR-1"
        name: "Model vytvoríme my"
        # ✍️ Когда выбирается этот путь.
        condition: ""
        # ✍️ Шаги: кто что делает, включая одобрение клиентом и ревизии.
        steps:
          - ""
          - ""
          - ""

      - id: "VAR-2"
        name: "Model dodá zákazník"
        # ✍️ Когда выбирается этот путь.
        condition: ""
        # ✍️ Шаги: проверка модели клиента и что дальше.
        steps:
          - ""
          - ""

    # ✍️ Исключения, меняющие результат: клиент отклонил / кончились ревизии (VAR-1);
    # ✍️ модель клиента нельзя напечатать — переход на VAR-1? (VAR-2); клиент не отвечает.
    exceptions:
      - ""

    # ✍️ Чем заканчивается. В модели: Flow «approved 3D model» → BP-PrintAndCheckQuality.
    outcome: ""

    provides_business_services: ["BS-3DModelingApproval"]
    business_objects: ["BO-3DModel"]
    requirements: ["R-001"]
